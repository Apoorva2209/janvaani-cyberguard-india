name: Build Native Apps

# Builds the native JanVaani apps on GitHub-hosted runners:
#   Android  - APK        (React Native / Expo, Gradle)
#   iOS      - Simulator  (React Native / Expo, Xcode, unsigned)
#   Windows  - App        (React Native for Windows, MSBuild)
#   macOS    - App        (React Native for macOS, Xcode, unsigned)
#   Linux    - AppImage and deb (Electron window showing the shared UI)
# Tag a release (git tag v1.0.0 && git push --tags) to attach the builds to a GitHub release.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apps.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm ci

      - name: Create Throwaway Debug Keystore
        # The repo never stores keystores. Release signing keys belong in encrypted secrets.
        run: |
          keytool -genkeypair -v -keystore packages/mobile/android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Release APK
        working-directory: packages/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp packages/mobile/android/app/build/outputs/apk/release/*.apk JanVaani-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janvaani-android-apk
          path: JanVaani-android.apk
          if-no-files-found: error

  ios:
    name: iOS (Simulator build)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Native iOS Project
        working-directory: packages/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Add iOS Extensions (SMS filter, caller labels)
        working-directory: packages/mobile
        run: ruby ios-extensions/add_extensions.rb

      - name: Install CocoaPods
        working-directory: packages/mobile/ios
        run: pod install

      - name: Build for iOS Simulator
        working-directory: packages/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package .app
        working-directory: packages/mobile/ios/build/Build/Products/Release-iphonesimulator
        run: ditto -c -k --keepParent *.app "$GITHUB_WORKSPACE/JanVaani-ios-simulator.zip"

      - name: Upload iOS Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janvaani-ios-simulator
          path: JanVaani-ios-simulator.zip
          if-no-files-found: error

  windows:
    name: Windows App
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows App (Release, x64)
        working-directory: packages/desktop
        shell: bash
        run: node ../../node_modules/@react-native-community/cli/build/bin.js run-windows --release --no-launch --no-deploy --arch x64 --logging

      - name: Create Signing Certificate
        # Self-signed, generated fresh each build. Users trust it through the installer.
        shell: pwsh
        run: |
          $plain = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$plain"
          "CERT_PASSWORD=$plain" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Apoorva SV" `
            -KeyUsage DigitalSignature -FriendlyName "JanVaani" `
            -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5) `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $secure = ConvertTo-SecureString -String $plain -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\JanVaani.pfx" -Password $secure | Out-Null
          New-Item -ItemType Directory -Force -Path dist\cert | Out-Null
          Export-Certificate -Cert $cert -FilePath "dist\cert\JanVaani.cer" | Out-Null

      - name: Package Signed MSIX
        shell: pwsh
        run: |
          msbuild packages\desktop\windows\JanvaaniDesktop.sln /restore `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\JanVaani.pfx" `
            /p:PackageCertificatePassword="$env:CERT_PASSWORD" `
            /p:GenerateAppInstallerFile=false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Package Files
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path packages\desktop\windows -Recurse -Filter *.msix -File |
            Where-Object { $_.FullName -match 'AppPackages' -and $_.FullName -notmatch 'Dependencies' } | Select-Object -First 1
          if (-not $msix) { throw 'No .msix was produced.' }
          Write-Output "Package: $($msix.FullName)"
          New-Item -ItemType Directory -Force -Path dist\package | Out-Null
          Copy-Item -Path "$($msix.DirectoryName)\*" -Destination dist\package -Recurse -Force
          Copy-Item -Path dist\cert\JanVaani.cer -Destination dist\package -Force
          Get-ChildItem dist\package -Recurse | Select-Object -ExpandProperty FullName

      - name: Build Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          & $iscc "/DPackageDir=$PWD\dist\package" "/DOutDir=$PWD\dist\installer" packages\desktop\windows\installer\JanVaani.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janvaani-windows-setup
          path: dist/installer/JanVaani-Setup.exe
          if-no-files-found: error
  macos:
    name: macOS App
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install CocoaPods
        working-directory: packages/desktop/macos
        run: pod install

      - name: Build macOS App (Release, unsigned)
        working-directory: packages/desktop/macos
        run: |
          xcodebuild -workspace JanVaani.xcworkspace -scheme JanVaani-macOS \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package .app
        working-directory: packages/desktop/macos/build/Build/Products/Release
        run: ditto -c -k --keepParent JanVaani.app "$GITHUB_WORKSPACE/JanVaani-macos.zip"

      - name: Upload macOS Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janvaani-macos
          path: JanVaani-macos.zip
          if-no-files-found: error

  linux:
    name: Linux App (AppImage and deb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export Shared App UI for the Web
        working-directory: packages/mobile
        run: |
          npm install --no-save --no-audit --no-fund react-native-web@~0.19.10 react-dom@18.2.0 @expo/metro-runtime@~3.2.3
          npx expo export --platform web --output-dir ../linux/web

      - name: Add App Icon
        run: |
          mkdir -p packages/linux/assets
          cp packages/mobile/assets/icon.png packages/linux/assets/icon.png

      - name: Build AppImage and deb
        working-directory: packages/linux
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage deb

      - name: Upload Linux Builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janvaani-linux
          path: |
            packages/linux/release/*.AppImage
            packages/linux/release/*.deb
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd artifacts
          gh release create "$TAG_NAME" \
            --repo "$REPO" \
            --title "JanVaani $TAG_NAME" \
            --generate-notes \
            janvaani-android-apk/*.apk \
            janvaani-ios-simulator/*.zip \
            janvaani-windows-setup/JanVaani-Setup.exe \
            janvaani-macos/*.zip \
            janvaani-linux/*.AppImage \
            janvaani-linux/*.deb