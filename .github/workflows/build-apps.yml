name: Build Native Apps

# Builds the native JanVaani apps on GitHub-hosted runners:
#   Android  - APK        (React Native / Expo, Gradle)
#   iOS      - Simulator  (React Native / Expo, Xcode, unsigned)
#   Windows  - App        (React Native for Windows, MSBuild)
#   macOS    - App        (React Native for macOS, Xcode, unsigned)
# Tag a release (git tag v1.0.0 && git push --tags) to attach the builds to a GitHub release.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apps.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm ci

      - name: Create Throwaway Debug Keystore
        # The repo never stores keystores. Release signing keys belong in encrypted secrets.
        run: |
          keytool -genkeypair -v -keystore packages/mobile/android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Release APK
        working-directory: packages/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janvaani-android-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS (Simulator build)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Native iOS Project
        working-directory: packages/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: packages/mobile/ios
        run: pod install

      - name: Build for iOS Simulator
        working-directory: packages/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package .app
        working-directory: packages/mobile/ios/build/Build/Products/Release-iphonesimulator
        run: ditto -c -k --keepParent *.app "$GITHUB_WORKSPACE/JanVaani-ios-simulator.zip"

      - name: Upload iOS Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janvaani-ios-simulator
          path: JanVaani-ios-simulator.zip
          if-no-files-found: error

  windows:
    name: Windows App
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows App (Release, x64)
        working-directory: packages/desktop
        shell: bash
        run: node ../../node_modules/@react-native-community/cli/build/bin.js run-windows --release --no-launch --no-deploy --arch x64 --logging

      - name: Collect Build Output
        shell: bash
        run: |
          mkdir -p dist
          cp -r packages/desktop/windows/x64/Release dist/JanVaani-windows-x64
          find dist -name '*.pdb' -delete
          find dist -name '*.obj' -delete

      - name: Upload Windows Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janvaani-windows-x64
          path: dist/JanVaani-windows-x64
          if-no-files-found: error

  macos:
    name: macOS App
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install CocoaPods
        working-directory: packages/desktop/macos
        run: pod install

      - name: Build macOS App (Release, unsigned)
        working-directory: packages/desktop/macos
        run: |
          xcodebuild -workspace JanVaani.xcworkspace -scheme JanVaani-macOS \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package .app
        working-directory: packages/desktop/macos/build/Build/Products/Release
        run: ditto -c -k --keepParent JanVaani.app "$GITHUB_WORKSPACE/JanVaani-macos.zip"

      - name: Upload macOS Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janvaani-macos
          path: JanVaani-macos.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd artifacts
          zip -r janvaani-windows-x64.zip janvaani-windows-x64
          gh release create "$TAG_NAME" \
            --repo "$REPO" \
            --title "JanVaani $TAG_NAME" \
            --generate-notes \
            janvaani-android-apk/*.apk \
            janvaani-ios-simulator/*.zip \
            janvaani-windows-x64.zip \
            janvaani-macos/*.zip