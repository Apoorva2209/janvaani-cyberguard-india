version: '3.8'

# ==============================================================================
# CYBERGUARD INDIA - SECURE MULTI-TIER DEVELOPMENT STACK
# ==============================================================================
# Security & Network Isolation:
# 1. Frontend-Network: Exposes frontend app to host on port 3001, communicates with backend.
# 2. Backend-Network: Exposes API to host on port 3000, connects to backend, DB, Redis, MinIO, ClamAV.
# 3. Data-Network: Dedicated internal network for databases, caches, object store, and AV daemon.
#    Postgres and Redis are NOT exposed to public interfaces on production.
# 4. ClamAV Service: Dedicated malware scanning daemon (clamd) for screening file uploads.
# 5. Secrets: Sourced strictly via root .env (never hardcoded in compose definitions).
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. POSTGRESQL 16 DATABASE
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyberguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberguard}
      POSTGRES_USER: ${POSTGRES_USER:-cyberguard_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-network
    ports:
      - "127.0.0.1:5432:5432" # Bind only to localhost loopback for development inspection
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberguard_app} -d ${POSTGRES_DB:-cyberguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. REDIS 7 CACHE & SESSION STORE
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyberguard_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ChangeMeRedisSecret2026!}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - data-network
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeMeRedisSecret2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. MINIO S3-COMPATIBLE OBJECT STORAGE (PRIVATE BUCKETS)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: cyberguard_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cg_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMeMinioSecret2026!}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - data-network
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. CLAMAV MALWARE SCANNING DAEMON
  # ----------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.3_base
    container_name: cyberguard_clamav
    restart: unless-stopped
    networks:
      - data-network
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan /bin/ls || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------------------------
  # 5. BACKEND API SERVICE (FASTIFY / TYPESCRIPT)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: cyberguard_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyberguard_app}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}@postgres:5432/${POSTGRES_DB:-cyberguard}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ChangeMeRedisSecret2026!}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-cg_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ChangeMeMinioSecret2026!}
      MINIO_USE_SSL: "false"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      JWT_SECRET: ${JWT_SECRET:-ChangeMeJwtSecretMin32BytesSuperRandom2026!}
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "3000:3000"
    networks:
      - frontend-network
      - backend-network
      - data-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 6. FRONTEND WEB APPLICATION (NEXT.JS 14 STANDALONE)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: cyberguard_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    networks:
      - frontend-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================
networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
  data-network:
    internal: false # Internal bridge for data tier
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  clamav_db:
    driver: local
